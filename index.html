
<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#101114"
  >

  <meta
    name="description"
    content="Um espaço privado para conversar com seus amigos."
  >

  <title>Chat — Mensagens</title>

  <!-- Ícones -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <!-- CSS global -->
  <link
    rel="stylesheet"
    href="css/style.css"
  >

  <!-- CSS do chat -->
  <link
    rel="stylesheet"
    href="css/chat.css"
  >
</head>

<body>

  <div class="app-container">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">

      <!-- LOGO -->
      <div class="sidebar-header">

        <a href="#" class="brand">
          <div class="brand-icon">
            <i class="fa-solid fa-comment-dots"></i>
          </div>

          <span class="brand-name">
            Chat<span>ly</span>
          </span>
        </a>

        <button
          class="icon-button sidebar-close"
          id="sidebar-close"
          aria-label="Fechar menu"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

      <!-- PERFIL -->
      <div class="user-profile">

        <div class="user-avatar">
          <img
            src="https://placehold.co/100x100/24232a/ffffff?text=U"
            alt="Foto do perfil"
            id="user-avatar"
          >

          <span class="online-indicator"></span>
        </div>

        <div class="user-info">

          <h2 id="user-name">
            Seu perfil
          </h2>

          <span id="user-username">
            @username
          </span>

        </div>

        <button
          class="icon-button profile-menu-button"
          aria-label="Opções do perfil"
        >
          <i class="fa-solid fa-ellipsis"></i>
        </button>

      </div>

      <!-- BUSCA -->
      <div class="sidebar-search">

        <div class="search-input-wrapper">

          <i class="fa-solid fa-magnifying-glass"></i>

          <input
            type="text"
            id="conversation-search"
            placeholder="Buscar conversas..."
            autocomplete="off"
          >

          <kbd>⌘ K</kbd>

        </div>

      </div>

      <!-- NAVEGAÇÃO -->
      <nav class="sidebar-navigation">

        <button class="nav-item active" data-view="chats">

          <i class="fa-solid fa-message"></i>

          <span>Conversas</span>

          <span class="nav-count" id="chat-count">
            0
          </span>

        </button>

        <button class="nav-item" data-view="friends">

          <i class="fa-solid fa-user-group"></i>

          <span>Amigos</span>

        </button>

        <button class="nav-item" data-view="requests">

          <i class="fa-solid fa-user-plus"></i>

          <span>Solicitações</span>

          <span
            class="notification-dot"
            id="request-indicator"
          ></span>

        </button>

      </nav>

      <!-- LISTA DE CONVERSAS -->
      <section class="conversation-section">

        <div class="section-heading">

          <h3>Mensagens</h3>

          <button
            class="icon-button"
            id="new-conversation"
            aria-label="Nova conversa"
          >
            <i class="fa-solid fa-plus"></i>
          </button>

        </div>

        <div
          class="conversation-list"
          id="conversation-list"
        >

          <!-- Conversas serão renderizadas pelo JavaScript -->

          <div class="empty-conversations">

            <i class="fa-regular fa-comments"></i>

            <p>
              Suas conversas aparecerão aqui.
            </p>

          </div>

        </div>

      </section>

      <!-- RODAPÉ -->
      <div class="sidebar-footer">

        <button class="footer-action" id="settings-button">

          <i class="fa-solid fa-gear"></i>

          <span>Configurações</span>

        </button>

        <button class="footer-action" id="logout-button">

          <i class="fa-solid fa-arrow-right-from-bracket"></i>

          <span>Sair da conta</span>

        </button>

      </div>

    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="main-content">

      <!-- HEADER -->
      <header class="chat-header">

        <div class="chat-header-left">

          <button
            class="icon-button sidebar-toggle"
            id="sidebar-toggle"
            aria-label="Abrir menu"
          >
            <i class="fa-solid fa-bars"></i>
          </button>

          <div class="chat-contact-avatar">

            <img
              src="https://placehold.co/100x100/24232a/ffffff?text=C"
              alt="Foto do contato"
              id="contact-avatar"
            >

          </div>

          <div class="chat-contact-info">

            <h1 id="contact-name">
              Selecione uma conversa
            </h1>

            <span id="contact-status">
              Suas mensagens privadas
            </span>

          </div>

        </div>

        <div class="chat-header-actions">

          <button
            class="icon-button"
            id="search-messages"
            aria-label="Buscar mensagens"
          >
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>

          <button
            class="icon-button"
            id="contact-details"
            aria-label="Informações do contato"
          >
            <i class="fa-solid fa-circle-info"></i>
          </button>

        </div>

      </header>

      <!-- MENSAGENS -->
      <section
        class="messages-area"
        id="messages-area"
      >

        <div class="welcome-screen" id="welcome-screen">

          <div class="welcome-icon">

            <i class="fa-solid fa-comments"></i>

          </div>

          <h2>Seu espaço de conversa.</h2>

          <p>
            Escolha uma conversa ou adicione um amigo
            para começar a trocar mensagens.
          </p>

          <button
            class="primary-button"
            id="welcome-add-friend"
          >

            <i class="fa-solid fa-user-plus"></i>

            Adicionar amigo

          </button>

        </div>

        <!-- Mensagens serão renderizadas pelo JavaScript -->

      </section>

      <!-- ÁREA DE ENVIO -->
      <footer class="message-composer" id="message-composer">

        <div class="composer-container">

          <!-- ANEXAR IMAGEM -->
          <button
            class="icon-button attachment-button"
            id="attach-image"
            aria-label="Enviar imagem"
          >

            <i class="fa-solid fa-image"></i>

          </button>

          <input
            type="file"
            id="image-input"
            accept="image/*"
            hidden
          >

          <!-- CAMPO DE TEXTO -->
          <div class="message-input-wrapper">

            <textarea
              id="message-input"
              placeholder="Escreva uma mensagem..."
              rows="1"
              maxlength="4000"
              disabled
            ></textarea>

            <span class="input-hint">
              Enter para enviar
            </span>

          </div>

          <!-- ENVIAR -->
          <button
            class="send-button"
            id="send-message"
            aria-label="Enviar mensagem"
            disabled
          >

            <i class="fa-solid fa-arrow-up"></i>

          </button>

        </div>

        <p class="composer-disclaimer">
          Suas conversas são privadas.
        </p>

      </footer>

    </main>

    <!-- OVERLAY MOBILE -->
    <div
      class="sidebar-overlay"
      id="sidebar-overlay"
    ></div>

  </div>

  <!-- JAVASCRIPT -->
  <script src="js/app.js"></script>

</body>

</html>
